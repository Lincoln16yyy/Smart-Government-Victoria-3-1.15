l_braz_por:
 je_sg_law_advisor:0 "Conselheiro de Governo Inteligente"
 je_sg_law_advisor_reason:0 "Avaliação estratégica contínua das melhores opções de leis para a sua nação."
 sg_disabled_desc:0 "O Conselheiro de Governo Inteligente foi desativado."
 sg_je_activation_tt:0 "Exibido enquanto o Conselheiro de Governo Inteligente estiver ativo (decisão $sg_enable_smart_government$, ou automaticamente no primeiro pulso mensal depois que o mod é adicionado a um save)."
 sg_enable_smart_government:0 "Ativar Conselheiro de Governo Inteligente"
 sg_enable_smart_government_desc:0 "Cria o registro de diário do Governo Inteligente e executa a primeira avaliação. Funciona em campanha nova e em save em andamento. O conselheiro apenas recomenda leis; ele nunca as aprova por você."
 sg_disable_smart_government:0 "Desativar Conselheiro de Governo Inteligente"
 sg_disable_smart_government_desc:0 "Remove o registro de diário e todas as variáveis do conselheiro. Promulgações em andamento não são alteradas. O conselheiro não se reativa sozinho."
 sg_status_title:0 "Governo Inteligente"
 sg_status_enabled:0 "Conselheiro ativo"
 sg_last_refresh:0 "Última atualização: mês [JournalEntry.GetCountry.MakeScope.Var('sg_last_refresh_month').GetValue|v0], [JournalEntry.GetCountry.MakeScope.Var('sg_last_refresh_year').GetValue|v0]"
 sg_rank_diagnostic:0 "Ciclo de ranking: [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_evaluated').GetValue|v0] leis verificadas · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_available').GetValue|v0] disponíveis · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_eligible').GetValue|v0] elegíveis · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_ignored').GetValue|v0] ignoradas · [JournalEntry.GetCountry.MakeScope.Var('sg_last_ranked_count').GetValue|v0] exibidas"
 sg_disable:0 "Desativar"
 sg_disable_tt:0 "Desativa o conselheiro e remove o registro de diário. Nenhuma lei é alterada."
 sg_refresh_tt:0 "Reavaliar agora. O conselheiro também reavalia todo mês."
 sg_header:0 "As recomendações são reavaliadas todo mês. Cada pontuação é benefício + apoio do governo − metade do risco + metade da chance estimada de promulgação. Leis com 0% de sucesso são excluídas; leis difíceis mas possíveis são penalizadas pela chance atual. Benefício e risco resumem modificadores mensuráveis da lei; o apoio do governo usa as posições dos grupos de interesse no governo (ponderadas por influência) e do governante. Passe o mouse sobre o nome da lei para ver os efeitos e requisitos atuais do jogo. Nada é promulgado automaticamente."
 sg_score_label:0 "Pontuação:"
 sg_support_label:0 "Apoio do governo:"
 sg_risk_label:0 "Risco:"
 sg_benefit_label:0 "Benefício:"
 sg_why_ranked_1:0 "Por que foi recomendada: [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_benefit_score').GetValue|0] de benefício + [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_politics').GetValue|0] de apoio do governo − metade de [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_risk_score').GetValue|0] de risco + metade de [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_enactment_chance').GetValue|0]% de sucesso estimado."
 sg_why_ranked_2:0 "Por que foi recomendada: [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_benefit_score').GetValue|0] de benefício + [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_politics').GetValue|0] de apoio do governo − metade de [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_risk_score').GetValue|0] de risco + metade de [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_enactment_chance').GetValue|0]% de sucesso estimado."
 sg_why_ranked_3:0 "Por que foi recomendada: [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_benefit_score').GetValue|0] de benefício + [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_politics').GetValue|0] de apoio do governo − metade de [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_risk_score').GetValue|0] de risco + metade de [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_enactment_chance').GetValue|0]% de sucesso estimado."
 sg_enact:0 "Promulgar"
 sg_enact_tt:0 "Inicia o processo normal de promulgação desta lei. O botão fica desativado enquanto outra lei estiver sendo promulgada. O conselheiro verifica a disponibilidade novamente antes de começar."
 sg_ignore:0 "Ignorar"
 sg_ignore_tt:0 "Oculta esta lei das recomendações até limpar a lista de ignoradas. É possível ignorar até três leis."
 sg_requirements_hint:0 "Requisitos não atendidos — passe o mouse"
 sg_effects_hint:0 "Efeitos — passe o mouse"
 sg_empty:0 "Nenhuma lei disponível pode ser recomendada no momento. As leis podem já estar ativas, bloqueadas pelos requisitos atuais ou na lista de ignoradas. Use o botão de reavaliar ou limpe a lista de ignoradas."
 sg_clear_ignored:0 "Limpar ignoradas"
 sg_clear_ignored_tt:0 "Esquece as leis ignoradas e reavalia imediatamente."
 sg_diagnostics:0 "Diagnóstico"
 sg_diagnostics_tt:0 "Reavalia agora e mantém visíveis no registro os contadores do ranking. Defina a variável de país sg_debug para também registrar mensagens de ciclo de vida."
 sg_footer_note:0 "Apenas recomendações. As leis seguem o processo normal de promulgação."
