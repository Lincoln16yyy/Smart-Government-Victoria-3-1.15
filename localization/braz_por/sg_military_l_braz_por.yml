l_braz_por:
 sg_military_title:0 "Conselheiro Militar"
 sg_military_refresh_tt:0 "Reavaliar as recomendações militares"
 sg_military_summary:0 "Batalhões regulares [JournalEntry.GetCountry.MakeScope.Var('sg_military_army_size').GetValue|v0] · Navios [JournalEntry.GetCountry.MakeScope.Var('sg_military_navy_size').GetValue|v0]\nSaldo semanal observado @money![JournalEntry.GetCountry.MakeScope.Var('sg_military_balance').GetValue|D+=0]"
 sg_military_idle:0 "Nenhuma ação militar prioritária nesta análise."
 sg_military_land:0 "#bold Média · Recrutar [JournalEntry.GetCountry.MakeScope.Var('sg_military_land_count').GetValue|v0] de infantaria de linha#!\nPendente · O exército tem menos de 10 batalhões regulares. O reforço aumenta a reserva defensiva.\nMilitar → Exércitos → [JournalEntry.GetCountry.MakeScope.Var('sg_military_land_formation').GetMilitaryFormation.GetNameNoFormatting] → adicionar infantaria de linha. Priorize [JournalEntry.GetCountry.MakeScope.Var('sg_military_land_state').GetState.GetNameNoFormatting], com quartel e acesso ao mercado. Confira vagas, mão de obra, fila e custo antes de confirmar."
 sg_military_land_progress:0 "Histórico terrestre · Possivelmente atendida. O total nacional e a infantaria de linha da formação indicada atingiram as metas."
 sg_military_land_expired:0 "Histórico terrestre · Desatualizada. O prazo terminou ou as condições mudaram."
 sg_military_naval:0 "#bold Média · Construir 1 fragata de escolta#!\nPendente · Você tem menos de 3 navios e um rival com maior força naval. A fragata reforça a escolta da frota.\nMilitar → Marinha → [JournalEntry.GetCountry.MakeScope.Var('sg_military_naval_formation').GetMilitaryFormation.GetNameNoFormatting] → construir navio. Confira se [JournalEntry.GetCountry.MakeScope.Var('sg_military_naval_state').GetState.GetNameNoFormatting], onde há estaleiro e administração naval, aparece como local apto e se já há uma fragata na fila. Revise os custos antes de confirmar."
 sg_military_supply:0 "#bold Alta · Resolver a escassez de [JournalEntry.GetCountry.MakeScope.Var('sg_military_shortage').GetMarketGoods.GetGoods.GetName]#!\nPendente · Abra o bem no Mercado. Compare ordens de compra e venda e investigue a produção e as opções de importação. Adie novas encomendas militares até normalizar o fornecimento."
 sg_military_fiscal:0 "#bold Alta · Adiar novos gastos militares#!\nPendente · A margem, a reserva ou a dívida não atende à guarda de expansão. No Orçamento, revise saldo e despesas militares. Na fila militar, deixe para depois as novas encomendas e modernizações dispensáveis."
 sg_military_front:0 "#bold Crítica · Revisar a organização de [JournalEntry.GetCountry.MakeScope.Var('sg_military_target').GetMilitaryFormation.GetNameNoFormatting]#!\nPendente · A formação tem um general numa frente e tem organização-alvo abaixo de 80. Abra a formação, consulte os motivos no indicador de organização e avalie uma ordem defensiva enquanto corrige a causa."
 sg_military_readiness:0 "#bold Alta · Conferir a prontidão para o conflito#!\nPendente · O país participa de uma guerra ou jogada diplomática. Em Militar, confira a mobilização das formações e as estimativas de custo. Use as frentes e objetivos da jogada para decidir quais precisam ser mobilizadas."
 sg_military_modernize:0 "#bold Média · Modernizar a infantaria irregular de [JournalEntry.GetCountry.MakeScope.Var('sg_military_target').GetMilitaryFormation.GetNameNoFormatting]#!\nPendente · A infantaria de linha está desbloqueada e há oferta de armas leves. Abra a aba Unidades da formação, selecione a infantaria irregular e compare a melhora de defesa e o custo antes de atualizar para infantaria de linha."
 sg_military_commander:0 "#bold Média · Nomear 1 general para [JournalEntry.GetCountry.MakeScope.Var('sg_military_target').GetMilitaryFormation.GetNameNoFormatting]#!\nPendente · A formação tem pelo menos 4 batalhões e nenhum comandante. Em Militar → Exércitos, selecione a formação e recrute um general para dar ordens em combate."
 sg_military_rival:0 "#bold Baixa · Revisar a defesa da fronteira com [JournalEntry.GetCountry.MakeScope.Var('sg_military_rival_country').GetCountry.GetName]#!\nPendente · Há rivalidade formal, fronteira terrestre e o rival tem mais batalhões. Abra Diplomacia para verificar o contexto e localize as formações disponíveis no Quartel-General da fronteira."
 sg_military_naval_progress:0 "Histórico naval · Possivelmente atendida. A frota indicada ganhou uma fragata."
 sg_military_naval_expired:0 "Histórico naval · Desatualizada. O prazo terminou ou as condições mudaram."
