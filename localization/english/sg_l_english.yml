l_english:
 je_sg_law_advisor:0 "Smart Government Advisor"
 je_sg_law_advisor_reason:0 "Continuous strategic evaluation of the best laws for your nation."
 sg_disabled_desc:0 "The Smart Government Advisor has been deactivated."
 sg_je_activation_tt:0 "Shown while the Smart Government Advisor is enabled (the $sg_enable_smart_government$ decision, or automatically on the first monthly pulse after the mod is added to a save)."
 sg_enable_smart_government:0 "Enable Smart Government Advisor"
 sg_enable_smart_government_desc:0 "Creates the Smart Government journal entry and runs the first evaluation. Works in a new campaign and in a running save. The advisor only recommends laws; it never approves them for you."
 sg_disable_smart_government:0 "Disable Smart Government Advisor"
 sg_disable_smart_government_desc:0 "Removes the journal entry and all advisor variables. Already running enactments are untouched. The advisor will not re-enable itself."
 sg_status_title:0 "Smart Government"
 sg_status_enabled:0 "Advisor active"
 sg_last_refresh:0 "Last refreshed: month [JournalEntry.GetCountry.MakeScope.Var('sg_last_refresh_month').GetValue|v0], [JournalEntry.GetCountry.MakeScope.Var('sg_last_refresh_year').GetValue|v0]"
 sg_rank_diagnostic:0 "Ranking cycle: [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_evaluated').GetValue|v0] laws checked · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_available').GetValue|v0] available · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_ignored').GetValue|v0] ignored · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_upgrade_filtered').GetValue|v0] no real gain · [JournalEntry.GetCountry.MakeScope.Var('sg_last_rank_eligible').GetValue|v0] eligible · [JournalEntry.GetCountry.MakeScope.Var('sg_last_ranked_count').GetValue|v0] shown"
 sg_disable:0 "Disable"
 sg_disable_tt:0 "Disable the advisor and remove its journal entry. No law is changed."
 sg_refresh_tt:0 "Reassess now. The advisor also reassesses every month."
 sg_header:0 "The three best available laws are reassessed monthly and ranked globally, not one per group. A law only appears when its merit (benefit + government support − half of risk) beats the law currently in force in its group by at least 5 points; the displayed score also adds half of the estimated enactment chance. Hover a law name for its real effects and requirements."
 sg_header_tt:0 "Ranking details: benefit and risk summarize measurable law modifiers; government support uses the stances of interest groups in government (weighted by clout) plus the ruler's stance. A powerful interest group that strongly disapproves adds 12 risk. The displayed score adds half of the estimated enactment chance to merit. Nothing is enacted automatically."
 sg_enacting:0 "A law is currently being enacted. Recommendations are paused and will return when the enactment finishes."
 sg_opposition_warning:0 "A powerful interest group strongly disapproves of this law: +12 risk."
 sg_score_label:0 "Score:"
 sg_support_label:0 "Gov. support:"
 sg_risk_label:0 "Risk:"
 sg_benefit_label:0 "Benefit:"
 sg_why_ranked_1:0 "Why ranked: [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_benefit_score').GetValue|0] benefit + [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_politics').GetValue|0] government support − half of [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_risk_score').GetValue|0] risk + half of [JournalEntry.GetCountry.MakeScope.Var('sg_top_1_enactment_chance').GetValue|0]% estimated success."
 sg_why_ranked_2:0 "Why ranked: [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_benefit_score').GetValue|0] benefit + [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_politics').GetValue|0] government support − half of [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_risk_score').GetValue|0] risk + half of [JournalEntry.GetCountry.MakeScope.Var('sg_top_2_enactment_chance').GetValue|0]% estimated success."
 sg_why_ranked_3:0 "Why ranked: [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_benefit_score').GetValue|0] benefit + [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_politics').GetValue|0] government support − half of [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_risk_score').GetValue|0] risk + half of [JournalEntry.GetCountry.MakeScope.Var('sg_top_3_enactment_chance').GetValue|0]% estimated success."
 sg_enact:0 "Enact"
 sg_enact_tt:0 "Start the normal enactment process for this law. The button is disabled while another law is being enacted. The advisor re-checks availability before starting."
 sg_ignore:0 "Ignore"
 sg_ignore_tt:0 "Hide this law from the recommendations until you clear the ignored list. Up to three laws can be ignored."
 sg_requirements_hint:0 "Requirements not met — hover"
 sg_effects_hint:0 "Effects — hover"
 sg_empty:0 "No available law currently improves on what is already in force. The recommended laws for this country are already in force; wait for the next monthly review or for a change in the country's direction.\n\nLaws blocked by requirements, ignored laws and laws hidden while another enactment is running are not considered."
 sg_ignored_title:0 "Ignored laws:"
 sg_restore:0 "Restore"
 sg_restore_tt:0 "Remove this law from the ignored list and reassess recommendations immediately."
 sg_clear_ignored:0 "Clear all"
 sg_clear_ignored_tt:0 "Remove all laws from the ignored list and reassess recommendations immediately."
 sg_diagnostics:0 "Diagnostics"
 sg_diagnostics_tt:0 "Reassess now and keep the ranking counters visible in the journal. Set the country variable sg_debug to also log lifecycle messages."
 sg_footer_note:0 "Recommendations only. Laws still follow the normal enactment process."
