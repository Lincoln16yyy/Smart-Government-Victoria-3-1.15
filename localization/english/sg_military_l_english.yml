l_english:
 sg_military_title:0 "Military Advisor"
 sg_military_refresh_tt:0 "Reassess military recommendations"
 sg_military_summary:0 "Regular battalions [JournalEntry.GetCountry.MakeScope.Var('sg_military_army_size').GetValue|v0] · Ships [JournalEntry.GetCountry.MakeScope.Var('sg_military_navy_size').GetValue|v0]\nObserved weekly balance @money![JournalEntry.GetCountry.MakeScope.Var('sg_military_balance').GetValue|D+=0]"
 sg_military_idle:0 "No priority military action in this assessment."
 sg_military_land:0 "#bold Medium · Recruit [JournalEntry.GetCountry.MakeScope.Var('sg_military_land_count').GetValue|v0] line infantry battalions#!\nPending · The army has fewer than 10 regular battalions. Reinforcement adds to the defensive reserve.\nMilitary → Armies → [JournalEntry.GetCountry.MakeScope.Var('sg_military_land_formation').GetMilitaryFormation.GetNameNoFormatting] → add line infantry. Prefer [JournalEntry.GetCountry.MakeScope.Var('sg_military_land_state').GetState.GetNameNoFormatting], which has barracks and market access. Check slots, manpower, the queue and cost before confirming."
 sg_military_land_progress:0 "Army history · Possibly fulfilled. Both the national battalion total and the selected formation’s line infantry reached their targets."
 sg_military_land_expired:0 "Army history · Outdated. The review window ended or conditions changed."
 sg_military_naval:0 "#bold Medium · Build 1 escort frigate#!\nPending · You have fewer than 3 ships and a rival with greater naval strength. A frigate adds screening to your fleet.\nMilitary → Navy → [JournalEntry.GetCountry.MakeScope.Var('sg_military_naval_formation').GetMilitaryFormation.GetNameNoFormatting] → build ship. Check that [JournalEntry.GetCountry.MakeScope.Var('sg_military_naval_state').GetState.GetNameNoFormatting], which has a shipyard and naval administration, is an eligible site and that a frigate is not already queued. Review costs before confirming."
 sg_military_supply:0 "#bold High · Address the shortage of [JournalEntry.GetCountry.MakeScope.Var('sg_military_shortage').GetMarketGoods.GetGoods.GetName]#!\nPending · Open the good in the Market. Compare buy and sell orders and check production and import options. Defer new military orders until supply recovers."
 sg_military_fiscal:0 "#bold High · Defer new military spending#!\nPending · Your surplus, reserves or debt do not pass the expansion check. Review the balance and military expenses in the Budget panel. Defer new nonessential orders and upgrades in the military queue."
 sg_military_front:0 "#bold Critical · Review organization in [JournalEntry.GetCountry.MakeScope.Var('sg_military_target').GetMilitaryFormation.GetNameNoFormatting]#!\nPending · This formation has a general on a front and has target organization below 80. Open the formation, inspect the reasons in the organization indicator and consider a defensive order while addressing the cause."
 sg_military_readiness:0 "#bold High · Review conflict readiness#!\nPending · The country is involved in a war or diplomatic play. In Military, review formation mobilization and estimated costs. Use the fronts and objectives of the play to determine which formations to mobilize."
 sg_military_modernize:0 "#bold Medium · Upgrade irregular infantry in [JournalEntry.GetCountry.MakeScope.Var('sg_military_target').GetMilitaryFormation.GetNameNoFormatting]#!\nPending · Line infantry is unlocked and small arms are available. Open the formation's Units tab, select irregular infantry and compare defense and cost before upgrading to line infantry."
 sg_military_commander:0 "#bold Medium · Assign 1 general to [JournalEntry.GetCountry.MakeScope.Var('sg_military_target').GetMilitaryFormation.GetNameNoFormatting]#!\nPending · This formation has at least 4 battalions and no commander. In Military → Armies, select the formation and recruit a general so it can receive battle orders."
 sg_military_rival:0 "#bold Low · Review the border with [JournalEntry.GetCountry.MakeScope.Var('sg_military_rival_country').GetCountry.GetName]#!\nPending · This formal rival shares a land border and has more battalions. Check the situation in Diplomacy and look for available formations at the border's HQ."
 sg_military_naval_progress:0 "Navy history · Possibly fulfilled. The selected fleet gained a frigate."
 sg_military_naval_expired:0 "Navy history · Outdated. The review window ended or conditions changed."
